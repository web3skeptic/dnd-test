<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iFrame Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .controls {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      align-items: center;
    }

    .controls label {
      font-size: 14px;
      color: #555;
      white-space: nowrap;
    }

    .controls input {
      flex: 1;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    .controls input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
    }

    .controls button {
      padding: 8px 16px;
      font-size: 14px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .controls button:hover {
      background: #4338ca;
    }

    #frame-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
    }

    #frame-container iframe {
      width: 300px;
      height: 600px;
      border: none;
    }
  </style>
</head>
<body>
  <div class="controls">
    <label for="url-input">URL</label>
    <input
      id="url-input"
      type="text"
      value="https://circles.gnosis.io/pilots/kudos-ga?group=dandelion&address=0xf48554937f18885c7f15c432c596b5843648231D"
      placeholder="https://..."
    />
    <button onclick="loadFrame()">Load</button>
  </div>
  <div id="frame-container">
    <iframe id="demo-frame" src="" allowfullscreen></iframe>
  </div>

  <script>
    function loadFrame() {
      var url = document.getElementById('url-input').value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
        document.getElementById('url-input').value = url;
      }
      document.getElementById('demo-frame').src = url;
    }

    document.getElementById('url-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') loadFrame();
    });

    loadFrame();
  </script>
</body>
</html>
